services:
  - type: web
    name: kidoland
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    disk:
      name: kidoland-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: KIDOLAND_DB_PATH
        value: /data/kidoland.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
