name: CI / Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          cd server && (npm ci || npm install)

      - name: Check TypeScript types & linting
        run: npm run build && npm run lint

      - name: Run backend test matrix
        run: npm test --prefix server

      - name: Run browser UI regression test suite
        run: npm test
